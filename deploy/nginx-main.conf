worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  map $uri $spark_log_uri {
    ~^(?<spark_ui_log_root>.*?\/spark-ui)\/t\/[^/]+(?<spark_ui_log_rest>/.*)?$ "$spark_ui_log_root/t/[redacted]$spark_ui_log_rest";
    default $uri;
  }
  log_format main '$remote_addr - $remote_user [$time_local] "$request_method $spark_log_uri $server_protocol" '
                  '$status $body_bytes_sent '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /dev/stdout main;
  map $http_x_forwarded_proto $spark_forwarded_proto {
    default $scheme;
    "" $scheme;
  }
  map $http_x_forwarded_host $spark_forwarded_host {
    default $http_host;
    "" $http_host;
  }
  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/conf.d/*.conf;
}
