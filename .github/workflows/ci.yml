name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: spark_control_center_test
          POSTGRES_USER: spark_test
          POSTGRES_PASSWORD: spark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spark_test -d spark_control_center_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        env:
          TEST_POSTGRES_DSN: postgres://spark_test:spark_test@127.0.0.1:5432/spark_control_center_test?sslmode=disable
        run: go test ./...

      - name: Vet backend
        working-directory: backend
        run: go vet ./...

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm chart
        run: |
          helm lint charts/spark-control-center
          helm lint charts/spark-control-center -f charts/spark-control-center/examples/values-production.yaml
          helm template spark-console charts/spark-control-center \
            --namespace spark-console \
            -f charts/spark-control-center/examples/values-production.yaml >/dev/null
