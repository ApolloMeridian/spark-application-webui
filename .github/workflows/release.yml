name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test and build frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # The harness runs backend/plugin tests and vet with its own SQL fixtures.
      - name: Test Go backend and storage integrations
        run: node scripts/object-storage-local-test.mjs

      - name: Validate optional storage Helm configuration
        run: node scripts/object-storage-helm-test.mjs

      - name: Validate release version
        shell: bash
        run: |
          test "$(helm show chart charts/spark-control-center | awk '/^version:/ {print $2}')" = "${{ steps.version.outputs.value }}"
          test "$(node -p "require('./package.json').version")" = "${{ steps.version.outputs.value }}"

      - name: Build release images
        run: |
          docker build -f Dockerfile.prebuilt -t "spark-control-center:${{ steps.version.outputs.value }}" .
          docker build -f backend/Dockerfile -t "spark-control-center-backend:${{ steps.version.outputs.value }}" .
          docker build -f object-storage/Dockerfile -t "spark-control-center-object-storage:${{ steps.version.outputs.value }}" .

      - name: Smoke-test optional storage containers
        run: QA_VERSION="${{ steps.version.outputs.value }}" node scripts/container-object-storage-smoke.mjs

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p release
          docker save -o "release/spark-control-center-${{ steps.version.outputs.value }}.tar" "spark-control-center:${{ steps.version.outputs.value }}"
          docker save -o "release/spark-control-center-backend-${{ steps.version.outputs.value }}.tar" "spark-control-center-backend:${{ steps.version.outputs.value }}"
          docker save -o "release/spark-control-center-object-storage-${{ steps.version.outputs.value }}.tar" "spark-control-center-object-storage:${{ steps.version.outputs.value }}"
          helm package charts/spark-control-center --destination release
          # Publish the three independent image archives and Helm package; no checksum asset.
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 4

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          notes_file=".github/release-notes/${VERSION}.md"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            if [[ -f "${notes_file}" ]]; then
              gh release edit "${GITHUB_REF_NAME}" --title "Spark Control Center ${GITHUB_REF_NAME}" --notes-file "${notes_file}"
            fi
            gh release upload "${GITHUB_REF_NAME}" release/*.tar release/*.tgz --clobber
          elif [[ -f "${notes_file}" ]]; then
            gh release create "${GITHUB_REF_NAME}" release/*.tar release/*.tgz --verify-tag --title "Spark Control Center ${GITHUB_REF_NAME}" --notes-file "${notes_file}"
          else
            gh release create "${GITHUB_REF_NAME}" release/*.tar release/*.tgz --verify-tag --title "Spark Control Center ${GITHUB_REF_NAME}" --generate-notes
          fi
