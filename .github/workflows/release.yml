name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: spark_control_center_test
          POSTGRES_USER: spark_test
          POSTGRES_PASSWORD: spark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spark_test -d spark_control_center_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test and build frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        env:
          TEST_POSTGRES_DSN: postgres://spark_test:spark_test@127.0.0.1:5432/spark_control_center_test?sslmode=disable
        run: |
          go test ./...
          go vet ./...

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate release version
        shell: bash
        run: |
          test "$(helm show chart charts/spark-control-center | awk '/^version:/ {print $2}')" = "${{ steps.version.outputs.value }}"
          test "$(node -p "require('./package.json').version")" = "${{ steps.version.outputs.value }}"

      - name: Build release images
        run: |
          docker build -t "spark-control-center:${{ steps.version.outputs.value }}" .
          docker build -f backend/Dockerfile -t "spark-control-center-backend:${{ steps.version.outputs.value }}" .

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p release
          docker save -o "release/spark-control-center-${{ steps.version.outputs.value }}.tar" "spark-control-center:${{ steps.version.outputs.value }}"
          docker save -o "release/spark-control-center-backend-${{ steps.version.outputs.value }}.tar" "spark-control-center-backend:${{ steps.version.outputs.value }}"
          helm package charts/spark-control-center --destination release
          cd release
          sha256sum ./*.tar ./*.tgz > SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          notes_file=".github/release-notes/${VERSION}.md"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            if [[ -f "${notes_file}" ]]; then
              gh release edit "${GITHUB_REF_NAME}" --title "Spark Control Center ${GITHUB_REF_NAME}" --notes-file "${notes_file}"
            fi
            gh release upload "${GITHUB_REF_NAME}" release/* --clobber
          elif [[ -f "${notes_file}" ]]; then
            gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --title "Spark Control Center ${GITHUB_REF_NAME}" --notes-file "${notes_file}"
          else
            gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --title "Spark Control Center ${GITHUB_REF_NAME}" --generate-notes
          fi
