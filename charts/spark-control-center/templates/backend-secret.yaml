{{- if and .Values.backend.enabled (or .Values.database.credentials.create .Values.oidcSecret.create) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spark-control-center.fullname" . }}-backend
  labels:
    {{- include "spark-control-center.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  {{- if .Values.database.credentials.create }}
  {{ .Values.database.credentials.usernameKey }}: {{ .Values.database.credentials.username | quote }}
  {{ .Values.database.credentials.passwordKey }}: {{ required "database.credentials.password is required when database.credentials.create=true" .Values.database.credentials.password | quote }}
  {{- end }}
  {{- if .Values.oidcSecret.create }}
  {{ .Values.oidcSecret.clientSecretKey }}: {{ required "oidcSecret.clientSecret is required when oidcSecret.create=true" .Values.oidcSecret.clientSecret | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.backend.enabled (eq .Values.runtimeConfig.auth.mode "local") .Values.backend.auth.initialAdmin.createSecret (not .Values.backend.auth.initialAdmin.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spark-control-center.fullname" . }}-local-auth
  labels:
    {{- include "spark-control-center.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  {{ .Values.backend.auth.initialAdmin.passwordKey }}: {{ required "backend.auth.initialAdmin.password is required when createSecret=true" .Values.backend.auth.initialAdmin.password | quote }}
{{- end }}
