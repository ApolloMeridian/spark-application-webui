apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "spark-control-center.fullname" . }}-test-connection"
  labels:
    {{- include "spark-control-center.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: [wget]
      args: ["-qO-", "http://{{ include "spark-control-center.fullname" . }}:{{ .Values.service.port }}/healthz"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
        runAsNonRoot: true
        runAsUser: 65534
