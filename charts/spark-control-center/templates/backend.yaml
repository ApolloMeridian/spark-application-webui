{{- if .Values.backend.enabled }}
{{- if not (or .Values.database.credentials.existingSecret .Values.database.credentials.create) }}{{ fail "backend.enabled requires database.credentials.existingSecret or database.credentials.create=true" }}{{ end }}
{{- if and (eq .Values.runtimeConfig.auth.mode "oidc") (not .Values.backend.auth.adminBypass) (not (or .Values.oidcSecret.existingSecret .Values.oidcSecret.create)) }}{{ fail "OIDC mode without admin bypass requires oidcSecret.existingSecret or oidcSecret.create=true" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spark-control-center.fullname" . }}-backend
  labels:
    {{- include "spark-control-center.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "spark-control-center.backendSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spark-control-center.backendSelectorLabels" . | nindent 8 }}
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "spark-control-center.backendServiceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
          env:
            - name: HTTP_ADDR
              value: ":{{ .Values.backend.service.port }}"
            - name: KUBERNETES_CLUSTER_NAME
              value: {{ .Values.runtimeConfig.cluster.name | quote }}
            - name: WATCH_NAMESPACES
              value: {{ join "," .Values.rbac.namespaces | quote }}
            - name: SPARKAPPLICATION_API_VERSION
              value: {{ .Values.backend.sparkApplicationAPIVersion | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.prometheus.url | quote }}
            - name: PROMETHEUS_QUERY_TIMEOUT
              value: {{ .Values.prometheus.queryTimeout | quote }}
            - name: PROMETHEUS_LOOKBACK
              value: {{ .Values.prometheus.lookback | quote }}
            - name: DATABASE_HOST
              value: {{ .Values.database.host | quote }}
            - name: DATABASE_PORT
              value: {{ .Values.database.port | quote }}
            - name: DATABASE_NAME
              value: {{ .Values.database.name | quote }}
            - name: DATABASE_SSLMODE
              value: {{ .Values.database.sslMode | quote }}
            - name: DATABASE_MAX_OPEN_CONNECTIONS
              value: {{ .Values.database.maxOpenConnections | quote }}
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "spark-control-center.backendSecretName" . }}
                  key: {{ .Values.database.credentials.usernameKey }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "spark-control-center.backendSecretName" . }}
                  key: {{ .Values.database.credentials.passwordKey }}
            - name: AUTH_MODE
              value: {{ .Values.runtimeConfig.auth.mode | quote }}
            - name: AUTH_ADMIN_BYPASS
              value: {{ .Values.backend.auth.adminBypass | quote }}
            - name: OIDC_ISSUER_URL
              value: {{ .Values.runtimeConfig.auth.oidc.issuerUrl | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.runtimeConfig.auth.oidc.clientId | quote }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.runtimeConfig.auth.oidc.audience | quote }}
            {{- if and (eq .Values.runtimeConfig.auth.mode "oidc") (not .Values.backend.auth.adminBypass) }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "spark-control-center.oidcSecretName" . }}
                  key: {{ .Values.oidcSecret.clientSecretKey }}
            {{- end }}
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- with .Values.backend.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.backend.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "spark-control-center.fullname" . }}-backend
  labels:
    {{- include "spark-control-center.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "spark-control-center.backendSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
{{- end }}
