{{- if and .Values.backend.enabled .Values.rbac.create }}
{{- if .Values.rbac.clusterWide }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "spark-control-center.fullname" . }}-backend
  labels:
    {{- include "spark-control-center.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get]
  - apiGroups: [sparkoperator.k8s.io]
    resources: [sparkapplications]
    verbs:
      - get
      - list
      - watch
      {{- if .Values.runtimeConfig.features.submit }}
      - create
      {{- end }}
      {{- if .Values.runtimeConfig.features.kill }}
      - patch
      - delete
      {{- end }}
  - apiGroups: [""]
    resources: [pods]
    verbs:
      - get
      - list
      - watch
      {{- if .Values.runtimeConfig.features.kill }}
      - patch
      - delete
      {{- end }}
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "spark-control-center.fullname" . }}-backend
  labels:
    {{- include "spark-control-center.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "spark-control-center.fullname" . }}-backend
subjects:
  - kind: ServiceAccount
    name: {{ include "spark-control-center.backendServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- range $namespace := .Values.rbac.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "spark-control-center.fullname" $ }}-backend
  namespace: {{ $namespace }}
  labels:
    {{- include "spark-control-center.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get]
  - apiGroups: [sparkoperator.k8s.io]
    resources: [sparkapplications]
    verbs:
      - get
      - list
      - watch
      {{- if $.Values.runtimeConfig.features.submit }}
      - create
      {{- end }}
      {{- if $.Values.runtimeConfig.features.kill }}
      - patch
      - delete
      {{- end }}
  - apiGroups: [""]
    resources: [pods]
    verbs:
      - get
      - list
      - watch
      {{- if $.Values.runtimeConfig.features.kill }}
      - patch
      - delete
      {{- end }}
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "spark-control-center.fullname" $ }}-backend
  namespace: {{ $namespace }}
  labels:
    {{- include "spark-control-center.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "spark-control-center.fullname" $ }}-backend
subjects:
  - kind: ServiceAccount
    name: {{ include "spark-control-center.backendServiceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.backend.enabled .Values.rbac.create .Values.overview.resourcePools.enabled }}
{{- $name := printf "%s-%s-overview-nodes" .Release.Namespace (include "spark-control-center.fullname" .) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "spark-control-center.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "spark-control-center.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "spark-control-center.backendServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
