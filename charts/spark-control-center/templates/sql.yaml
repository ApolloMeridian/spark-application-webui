{{- if .Values.sql.enabled }}
{{- if not (and .Values.backend.enabled .Values.apiProxy.enabled (eq .Values.runtimeConfig.dataMode "api") (not .Values.apiProxy.upstream)) }}
{{- fail "sql requires the chart backend, default apiProxy upstream and runtimeConfig.dataMode=api" }}
{{- end }}
{{- $sql := .Values.sql }}
{{- $name := printf "%s-sql" (include "spark-control-center.fullname" .) }}
{{- $location := include "spark-control-center.sqlResultLocation" . | fromJson }}
{{- $bootstrap := list }}
{{- range .Values.objectStorage.bootstrapGrants }}
  {{- if and (eq .connection $location.connection) (or .allBuckets (eq (default "" .bucket) $location.bucket)) }}
    {{- $bootstrap = append $bootstrap (dict "username" .username "tenantId" .tenantId) }}
  {{- end }}
{{- end }}
{{- $catalogSecret := default (include "spark-control-center.backendSecretName" .) $sql.catalog.credentialsSecret }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "spark-control-center.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "spark-control-center.labels" . | nindent 4 }}
    app.kubernetes.io/component: sql
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sql
  ports:
    - name: http
      port: 8083
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "spark-control-center.labels" . | nindent 4 }}
    app.kubernetes.io/component: sql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sql
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: sql
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sql
          image: "{{ $sql.image.repository }}:{{ $sql.image.tag }}"
          imagePullPolicy: {{ $sql.image.pullPolicy }}
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          ports:
            - { name: http, containerPort: 8083 }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          env:
            - name: SQL_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "objectStorage.internalAuth.existingSecret is required" .Values.objectStorage.internalAuth.existingSecret | quote }}
                  key: {{ .Values.objectStorage.internalAuth.signingKeyKey | quote }}
            - { name: DATABASE_HOST, value: {{ .Values.database.host | quote }} }
            - { name: DATABASE_PORT, value: {{ .Values.database.port | quote }} }
            - { name: DATABASE_NAME, value: {{ .Values.database.name | quote }} }
            - { name: DATABASE_SSLMODE, value: {{ .Values.database.sslMode | quote }} }
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "spark-control-center.backendSecretName" . | quote }}
                  key: {{ .Values.database.credentials.usernameKey | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "spark-control-center.backendSecretName" . | quote }}
                  key: {{ .Values.database.credentials.passwordKey | quote }}
            - name: SQL_STORAGE_URL
              value: "http://{{ include "spark-control-center.fullname" . }}-object-storage:8082"
            - name: SQL_BOOTSTRAP_USERS
              value: {{ $bootstrap | toJson | quote }}
            - name: SQL_KYUUBI_URL
              value: {{ required "sql.kyuubi.url is required" $sql.kyuubi.url | quote }}
            - name: SQL_POLARIS_URL
              value: {{ required "sql.catalog.url is required" $sql.catalog.url | quote }}
            - name: SQL_POLARIS_REALM
              value: {{ $sql.catalog.realm | quote }}
            - name: SQL_POLARIS_WAREHOUSE
              value: {{ required "sql.catalog.warehouse is required" $sql.catalog.warehouse | quote }}
            - name: SQL_POLARIS_ROLE
              value: {{ required "sql.catalog.principalRole is required" $sql.catalog.principalRole | quote }}
            - name: SQL_POLARIS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $catalogSecret | quote }}
                  key: {{ $sql.catalog.clientIDKey | quote }}
            - name: SQL_POLARIS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $catalogSecret | quote }}
                  key: {{ $sql.catalog.clientSecretKey | quote }}
            - name: SQL_MAX_ROWS
              value: {{ $sql.limits.maxRows | quote }}
            - name: SQL_MAX_BYTES
              value: {{ $sql.limits.maxBytes | int64 | quote }}
            - name: SQL_WORKERS
              value: {{ $sql.limits.workers | quote }}
            - name: SQL_QUERY_TIMEOUT
              value: {{ $sql.limits.queryTimeout | quote }}
            - name: SQL_RESULT_TTL
              value: {{ $sql.limits.resultTTL | quote }}
            - name: SQL_HISTORY_RETENTION
              value: {{ $sql.history.retention | quote }}
            - name: SQL_AUDIT_RETENTION
              value: {{ $sql.audit.retention | quote }}
            - name: SQL_ALLOW_HTTP
              value: {{ $sql.tls.allowHTTP | quote }}
            {{- if $sql.tls.caConfigMap }}
            - name: SQL_CA_FILE
              value: /etc/spark-console/ca/ca.crt
            {{- end }}
          resources:
            {{- toYaml $sql.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if $sql.tls.caConfigMap }}
            - { name: ca, mountPath: /etc/spark-console/ca, readOnly: true }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
        {{- if $sql.tls.caConfigMap }}
        - name: ca
          configMap:
            name: {{ $sql.tls.caConfigMap | quote }}
            items:
              - { key: {{ $sql.tls.caKey | quote }}, path: ca.crt }
        {{- end }}
{{- if $sql.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sql
  policyTypes: [Ingress{{ if $sql.networkPolicy.egress }}, Egress{{ end }}]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "spark-control-center.backendSelectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8083 }
  {{- with $sql.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
