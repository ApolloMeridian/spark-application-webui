{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "spark-control-center.fullname" . }}-frontend
  labels:
    {{- include "spark-control-center.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "spark-control-center.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress{{ if .Values.apiProxy.enabled }}, Egress{{ end }}]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
  {{- if .Values.apiProxy.enabled }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if .Values.backend.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "spark-control-center.backendSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
    {{- end }}
    {{- with .Values.networkPolicy.additionalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
