# Production deployment defaults. Copy this file, configure existing endpoints and Secrets,
# then install with ONE values file: helm upgrade --install spark-console CHART -f values.yaml.
# Frontend uses the real API and PostgreSQL login; object storage and OIDC are optional.
# This chart does not deploy PostgreSQL, Prometheus, Loki, Keycloak or storage buckets.
# Image repositories have no registry prefix. Mirror or preload images for your cluster.

# Set all three image repositories to locations reachable by your cluster, or preload the images on all nodes.
image:
  repository: spark-control-center
  tag: 1.5.1
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
replicaCount: 1
runtimeConfig:
  appName: Spark Control Center
  # Empty follows the browser timezone. Set any IANA timezone to override display.
  timeZone: ""
  dataMode: api
  api:
    baseUrl: /api
    requestTimeoutMs: 15000
  auth:
    mode: local
  cluster:
    name: kubernetes
    namespaces:
      - spark
  dashboard:
    refreshIntervalSeconds: 10
    defaultHistoryDays: 7
  historyServer:
    enabled: false
    baseUrl: ""
  features:
    kill: true
    audit: true
    sparkUi: true
    submit: true
    executorLogs: true
    templates: true
    batchOperations: true
    alerts: true
apiProxy:
  enabled: true
  upstream: ""
  connectTimeoutSeconds: 5
  readTimeoutSeconds: 60
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 101
service:
  type: ClusterIP
  port: 80
  annotations: {}
ingress:
  enabled: false
  className: nginx
  # These body/streaming settings target ingress-nginx. Adapt for other controllers and timeout values.
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 17m
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - host: spark-console.example.com
      paths:
        - path: /
          pathType: Prefix
  # Configure a TLS Secret unless ingress-nginx already serves a valid default/wildcard certificate.
  tls: []
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
pdb:
  enabled: false
  minAvailable: 1
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
backend:
  enabled: true
  replicaCount: 1
  image:
    repository: spark-control-center-backend
    tag: 1.5.1
    pullPolicy: IfNotPresent
  service:
    port: 8081
  sparkApplicationAPIVersion: sparkoperator.k8s.io/v1beta2
  auth:
    sessionTTL: 8h
    bcryptCost: 12
    # Unused with auth.mode=oidc. For local login configure an existing password Secret; never add a plaintext password.
    initialAdmin:
      username: admin
      displayName: Initial Administrator
      existingSecret: spark-console-admin-credentials
      passwordKey: password
      createSecret: false
      password: ""
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  podAnnotations: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
# Optional stateless plugin. Set enabled=false to disable it without changing core integrations.
objectStorage:
  enabled: false
  image:
    repository: spark-control-center-object-storage
    tag: 1.5.1
    pullPolicy: IfNotPresent
  replicaCount: 1
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  # Shared signing Secret: at least 32 bytes; same key is used by the backend and plugin.
  internalAuth:
    existingSecret: object-storage-signing
    signingKeyKey: signing-key
  # Empty existingSecret reuses the core DB credentials. Plugin must access the same local_users identity table.
  database:
    existingSecret: ""
    dsnKey: dsn
  limits:
    textMaxBytes: 1048576
    maxUploadBytes: 1073741824
    maxDownloadBytes: 1073741824
    partSizeBytes: 8388608
    maxConcurrentTransfers: 4
    requestsPerMinute: 600
    transferTimeoutSeconds: 600
  audit:
    retentionDays: 30
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 256Mi
  # Optional CNI-enforced isolation. Intranet deployment does not require this policy.
  # Existing cluster policies still apply. If enabled, allow DNS, PostgreSQL, storage
  # endpoints and (for GKE WIF) the metadata server; see docs/en/OBJECT-STORAGE.md.
  networkPolicy:
    enabled: false
    egress:
      - ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
      - ports:
          - protocol: TCP
            port: 80
          - protocol: TCP
            port: 443
          - protocol: TCP
            port: 5432
          - protocol: TCP
            port: 9000
  # Replace the MinIO endpoint/buckets with existing resources. No bucket is created by the chart.
  # Set connections and bootstrapGrants to [] if you do not use the plugin.
  # S3 supports MinIO/AWS-compatible endpoints. Credentials are mounted from a Secret.
  # For GCS, use provider: gcs and gcs: {projectID: YOUR_PROJECT_ID, authMode: gkeWif}.
  # No KSA override or GSA key is needed for direct GKE WIF. See OBJECT-STORAGE.md
  # for IAM bindings and generic Kubernetes WIF configuration.
  connections:
    - id: minio
      name: MinIO
      provider: s3
      buckets:
        - spark-artifacts
      s3:
        endpoint: http://minio.storage.svc:9000
        region: us-east-1
        forcePathStyle: true
        # Enable writes only after verifying conditional PutObject/CompleteMultipartUpload support.
        conditionalWrites: true
        credentialsSecret: object-storage-s3-credentials
        accessKeyKey: access-key
        secretKeyKey: secret-key
        caConfigMap: ""
  # One-time grants. Match an actual OIDC administrator username and persistent tenant ID. Revocations survive restart.
  bootstrapGrants:
    - username: admin
      tenantId: admin
      connection: minio
      allBuckets: true
      # Grants every bucket explicitly listed on this connection; no bucket discovery.
      prefix: ""
      actions:
        - list
        - read
        - download
        - upload
        - edit
        - delete
        - copy-source
        - copy-destination

prometheus:
  # Set the Prometheus query endpoint reachable from backend Pods.
  url: http://prometheus.monitoring.svc.cluster.local:9090
  queryTimeout: 15s
  lookback: 1h
  queryStep: 15s
  cpuRateWindow: 1m
loki:
  enabled: false
  url: ""
  queryTimeout: 15s
  maxEntries: 5000
alerts:
  evaluationInterval: 1m
  webhook:
    enabled: false
    url: ""
    timeout: 10s
# Existing PostgreSQL. This chart does not create the database/PVC. Match its TLS configuration.
database:
  host: postgresql.database.svc.cluster.local
  port: 5432
  name: spark_console
  # Prefer encrypted PostgreSQL connections; use disable only on trusted non-TLS servers.
  sslMode: require
  maxOpenConnections: 20
  credentials:
    username: spark_console
    existingSecret: spark-console-database-credentials
    usernameKey: username
    passwordKey: password
    create: false
    password: ""
# Single authoritative OIDC provider configuration. Match the callback URI exactly in Keycloak.
oidc:
  enabled: false
  providerName: Keycloak
  issuerURL: https://idp.example.com/realms/platform
  clientID: spark-control-center
  scopes:
    - openid
    - profile
    - email
    - groups
  usernameClaim: preferred_username
  groupsClaim: groups
  adminGroups:
    - spark-console-admins
  autoCreate: true
  redirectURL: https://spark-console.example.com/api/v1/auth/oidc/callback
  stateTTL: 10m
  # ConfigMap must exist in the release namespace; set existingConfigMap empty for a publicly trusted issuer.
  ca:
    existingConfigMap: ""
    key: ca.crt
    mountPath: /etc/spark-control-center/oidc-ca/ca.crt
  caFile: ""
oidcSecret:
  existingSecret: ""
  clientSecretKey: client-secret
  create: false
  clientSecret: ""
rbac:
  create: true
  clusterWide: false
  namespaces:
    - spark
networkPolicy:
  enabled: false
  ingressNamespaceSelector: {}
  additionalEgress: []
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}
workflows:
  enabled: true
  # Scheduler timezone is independent of browser display timezone.
  timeZone: UTC
  maxNodes: 50
  scheduler:
    enabled: true
    scanInterval: 5s
    maxActiveRuns: 20
    maxActiveTasks: 50
    maxCatchupRuns: 20
